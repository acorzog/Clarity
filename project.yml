name: FinanceTracker
options:
  bundleIdPrefix: com.andreacorzo
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  FinanceTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceTracker
    dependencies:
      - target: FinanceTrackerWidgets
        embed: true
    entitlements:
      path: FinanceTracker/FinanceTracker-LocalOnly.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.andreacorzo.FinanceTracker
    info:
      path: FinanceTracker/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.andreacorzo.FinanceTracker
            CFBundleURLSchemes:
              - financetracker
        # Full UILaunchScreen dict (rather than *_Generation: YES) so the system-level launch
        # screen is a solid dark background matching the app instead of default white — this is
        # what's visible for the instant before LaunchScreenView (SwiftUI) takes over.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreacorzo.FinanceTracker
        PRODUCT_NAME: FinanceTracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Clarity
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Clarity uses Face ID to keep your financial data private."
        SWIFT_EMIT_LOC_STRINGS: YES

  FinanceTrackerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceTrackerWidgets
      - path: FinanceTracker/Models
      - path: FinanceTracker/Views/Theme.swift
      - path: FinanceTracker/Services/SharedModelContainer.swift
    entitlements:
      path: FinanceTrackerWidgets/FinanceTrackerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.andreacorzo.FinanceTracker
    info:
      path: FinanceTrackerWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreacorzo.FinanceTracker.Widgets
        PRODUCT_NAME: FinanceTrackerWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES

  FinanceTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceTrackerTests
    dependencies:
      - target: FinanceTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreacorzo.FinanceTrackerTests
        PRODUCT_NAME: FinanceTrackerTests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
